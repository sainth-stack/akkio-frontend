<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- White Background -->
  <rect width="800" height="400" fill="white"/>
  
  <!-- Atom Logo -->
  <g transform="translate(400, 140)">
    <!-- Center sphere with gradient -->
    <defs>
      <radialGradient id="centerGrad" cx="50%" cy="30%">
        <stop offset="0%" style="stop-color:#90E0FF;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#1E88E5;stop-opacity:1" />
      </radialGradient>
      
      <radialGradient id="redOrbit" cx="50%" cy="50%">
        <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#EE5A6F;stop-opacity:1" />
      </radialGradient>
      
      <radialGradient id="yellowOrbit" cx="50%" cy="50%">
        <stop offset="0%" style="stop-color:#FFD93D;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#FFC107;stop-opacity:1" />
      </radialGradient>
      
      <radialGradient id="whiteOrbit" cx="50%" cy="50%">
        <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
      </radialGradient>
    </defs>
    
    <!-- Orbital paths -->
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="none" stroke="#4FC3F7" stroke-width="6" opacity="0.8" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="none" stroke="#4FC3F7" stroke-width="6" opacity="0.8" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="85" ry="35" fill="none" stroke="#29B6F6" stroke-width="6" opacity="0.7" transform="rotate(90)"/>
    
    <!-- Orbiting particles -->
    <circle cx="-75" cy="-15" r="12" fill="url(#redOrbit)"/>
    <circle cx="70" cy="20" r="12" fill="url(#yellowOrbit)"/>
    <circle cx="0" cy="38" r="10" fill="url(#whiteOrbit)"/>
    
    <!-- Center sphere -->
    <circle cx="0" cy="0" r="25" fill="url(#centerGrad)"/>
    <circle cx="0" cy="0" r="25" fill="url(#centerGrad)" opacity="0.5"/>
  </g>
  
  <!-- OTAMATAI Text -->
  <text x="400" y="270" font-family="Arial, sans-serif" font-size="72" font-weight="700" text-anchor="middle" letter-spacing="2">
    <tspan fill="#29B6F6">OTA</tspan><tspan fill="white" stroke="#29B6F6" stroke-width="1">MATA</tspan><tspan fill="#29B6F6">I</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="310" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#666" text-anchor="middle" letter-spacing="4">
    Autonomous AI Agents
  </text>
</svg>
